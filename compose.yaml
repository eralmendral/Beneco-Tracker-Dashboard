services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file:
      - ./server/.env
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: ./frontend
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
