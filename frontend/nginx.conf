server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location = /projects/beneco-dashboard {
    return 301 /projects/beneco-dashboard/;
  }

  location /projects/beneco-dashboard/api/ {
    proxy_pass http://api:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /projects/beneco-dashboard/ {
    try_files $uri $uri/ /projects/beneco-dashboard/index.html;
  }

  location / {
    return 404;
  }
}
